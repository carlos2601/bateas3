<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - J.A.C BATEAS 3</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="styles/design-system.css">
    <link rel="stylesheet" href="styles/components.css">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);</script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-base);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(99, 102, 241, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(139, 92, 246, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(236, 72, 153, 0.06) 0%, transparent 60%);
            pointer-events: none;
        }
        [data-theme="light"] body::before {
            display: none;
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 0 var(--space-6);
        }

        .login-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-2xl);
            padding: var(--space-10);
            box-shadow: var(--shadow-xl);
            animation: loginFadeIn 0.6s var(--ease-bounce);
        }

        @keyframes loginFadeIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-logo {
            text-align: center;
            margin-bottom: var(--space-8);
        }

        .login-logo img {
            width: 80px;
            height: 80px;
            border-radius: var(--radius-xl);
            margin: 0 auto var(--space-4);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.3);
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 8px 30px rgba(99, 102, 241, 0.3); }
            50% { box-shadow: 0 8px 40px rgba(99, 102, 241, 0.5); }
        }

        .login-logo h1 {
            font-size: var(--text-xl);
            font-weight: var(--weight-extrabold);
            color: var(--text-primary);
            margin-bottom: var(--space-1);
            letter-spacing: -0.02em;
        }

        .login-logo p {
            font-size: var(--text-sm);
            color: var(--text-muted);
            font-weight: var(--weight-medium);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: var(--space-5);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }

        .form-group label {
            font-size: var(--text-sm);
            font-weight: var(--weight-semibold);
            color: var(--text-secondary);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper .input {
            padding-right: var(--space-12);
        }

        .toggle-password {
            position: absolute;
            right: var(--space-3);
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: var(--space-1);
            transition: color var(--duration-fast) var(--ease-default);
        }

        .toggle-password:hover {
            color: var(--text-primary);
        }

        .error-box {
            display: none;
            padding: var(--space-3) var(--space-4);
            background: var(--color-danger-subtle);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: var(--radius-md);
            color: var(--color-danger);
            font-size: var(--text-sm);
            font-weight: var(--weight-medium);
            text-align: center;
            animation: shake 0.4s ease;
        }

        .error-box.visible {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .attempts-info {
            text-align: right;
            font-size: var(--text-xs);
            color: var(--text-muted);
        }

        .login-btn {
            width: 100%;
            padding: var(--space-3) var(--space-4);
            font-size: var(--text-base);
            margin-top: var(--space-2);
        }

        .login-footer {
            margin-top: var(--space-8);
            text-align: center;
            font-size: var(--text-xs);
            color: var(--text-muted);
            padding-top: var(--space-4);
            border-top: 1px solid var(--border-subtle);
        }

        .theme-toggle {
            position: fixed;
            top: var(--space-5);
            right: var(--space-5);
            z-index: 10;
        }
        [data-theme="light"] .theme-toggle {
            background: var(--bg-surface) !important;
            border: 1px solid rgba(0,0,0,0.15) !important;
            color: var(--text-primary) !important;
        }
    </style>
</head>
<body>
    <button class="btn-icon theme-toggle" id="themeToggle" data-tooltip="Cambiar tema">
        <i class="fas fa-moon"></i>
    </button>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/51/Escudo_Acci%C3%B3n_Comunal_Colombia.svg/500px-Escudo_Acci%C3%B3n_Comunal_Colombia.svg.png" alt="Escudo Accion Comunal">
                <h1>JUNTA DE ACCION COMUNAL</h1>
                <p>BARRIO BATEAS SECTOR 3</p>
            </div>

            <div class="error-box" id="errorMessage">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText">Credenciales incorrectas. Por favor intente nuevamente.</span>
            </div>

            <form class="login-form" id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label for="username">Correo electronico</label>
                    <div class="input-group">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" class="input" id="username" placeholder="correo@ejemplo.com" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contrasena</label>
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" class="input" id="password" placeholder="Ingrese su contrasena" required autocomplete="current-password">
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="attempts-info" id="attemptsInfo">
                    Intentos restantes: <strong id="remainingAttempts">3</strong>
                </div>

                <button type="submit" class="btn btn-primary login-btn" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Ingresar
                </button>
            </form>

            <div class="login-footer">
                <p style="margin-bottom:var(--space-2);">Sistema de acceso protegido &copy; <span id="currentYear"></span></p>
                <a href="usuarios_new.html" style="color:var(--brand-primary);text-decoration:none;font-size:var(--text-xs);font-weight:var(--weight-semibold);">
                    <i class="fas fa-users-cog"></i> Gestionar Usuarios
                </a>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Scripts -->
    <script src="core/event-bus.js"></script>
    <script src="core/app-state.js"></script>
    <script src="core/auth-service.js"></script>
    <script src="shared/components/toast.js"></script>
    <script>
        let failedAttempts = 0;
        const maxAttempts = 3;
        let isBlocked = false;

        // Init
        document.addEventListener('DOMContentLoaded', function() {
            try { Toast.init(); } catch(e) { console.error('Toast init error:', e); }
            document.getElementById('currentYear').textContent = new Date().getFullYear();

            // Si ya esta autenticado, ir al panel
            try {
                firebase.auth().onAuthStateChanged(function(user) {
                    if (user) {
                        window.location.href = 'panel_new.html';
                    }
                });
            } catch(e) {
                console.error('Auth check error:', e);
            }

            // Asegurar que los inputs esten habilitados
            document.getElementById('username').disabled = false;
            document.getElementById('password').disabled = false;
            document.getElementById('loginBtn').disabled = false;
        });

        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const input = document.getElementById('password');
            const icon = this.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        });

        // Login form submit
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            if (isBlocked) return;

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                document.getElementById('errorText').textContent = 'Ingrese usuario y contrasena';
                document.getElementById('errorMessage').classList.add('visible');
                return;
            }

            document.getElementById('loginBtn').disabled = true;
            document.getElementById('loginBtn').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Ingresando...';

            try {
                const email = username.includes('@') ? username : username + '@jacbateas.com';
                const result = await firebase.auth().signInWithEmailAndPassword(email, password);

                if (result.user) {
                    Toast.success('Bienvenido', 'Sesion iniciada como ' + email);
                    setTimeout(function() {
                        window.location.href = 'panel_new.html';
                    }, 500);
                } else {
                    failedAttempts++;
                    const remaining = maxAttempts - failedAttempts;
                    document.getElementById('remainingAttempts').textContent = remaining;
                    document.getElementById('errorText').textContent =
                        'Credenciales incorrectas. ' + (remaining > 0 ? 'Intentos restantes: ' + remaining : 'Sistema bloqueado.');
                    document.getElementById('errorMessage').classList.add('visible');

                    if (failedAttempts >= maxAttempts) {
                        blockSystem();
                    }
                }
            } catch(err) {
                console.error('Login error:', err);
                let msg = 'Error al conectar. Intente de nuevo.';
                if (err.code === 'auth/user-not-found') msg = 'Correo no registrado.';
                else if (err.code === 'auth/wrong-password') msg = 'Contrasena incorrecta.';
                else if (err.code === 'auth/invalid-email') msg = 'Correo invalido.';
                else if (err.code === 'auth/too-many-requests') msg = 'Demasiados intentos. Espere.';
                document.getElementById('errorText').textContent = msg;
                document.getElementById('errorMessage').classList.add('visible');
            } finally {
                document.getElementById('loginBtn').disabled = false;
                document.getElementById('loginBtn').innerHTML = '<i class="fas fa-sign-in-alt"></i> Ingresar';
            }
        });

        function blockSystem() {
            isBlocked = true;
            document.getElementById('loginBtn').disabled = true;
            document.getElementById('errorText').innerHTML =
                '<i class="fas fa-lock"></i> Sistema bloqueado temporalmente. Espere 3 minutos.';
            document.getElementById('attemptsInfo').style.display = 'none';

            setTimeout(function() {
                isBlocked = false;
                failedAttempts = 0;
                document.getElementById('loginBtn').disabled = false;
                document.getElementById('remainingAttempts').textContent = maxAttempts;
                document.getElementById('errorMessage').classList.remove('visible');
                document.getElementById('attemptsInfo').style.display = '';
                document.getElementById('password').value = '';
            }, 3 * 60 * 1000);
        }

        // Theme toggle
        document.getElementById('themeToggle').addEventListener('click', function() {
            const html = document.documentElement;
            const current = html.dataset.theme;
            const next = current === 'dark' ? 'light' : 'dark';
            html.dataset.theme = next;
            localStorage.setItem('theme', next);
            const icon = this.querySelector('i');
            icon.className = next === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        });

        // Apply saved theme
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.dataset.theme = savedTheme;
        document.querySelector('#themeToggle i').className = savedTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    </script>
</body>
</html>
